<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="aq" role="img" aria-label="Loading">
  <style>
    .aq{--aq-a:var(--color-accent,#5b8cff);overflow:visible}
    .aq .w0{stop-color:color-mix(in srgb,var(--aq-a) 30%,#e4f5ff)} .aq .w1{stop-color:color-mix(in srgb,var(--aq-a) 75%,#bfe3ff)}
    .aq .w2{stop-color:var(--aq-a)} .aq .w3{stop-color:color-mix(in srgb,var(--aq-a) 62%,#0d1d66)}
    .aq .co{stop-color:var(--aq-coral,#ff7d52)} .aq .te{stop-color:var(--aq-teal,#1fc4ad)} .aq .am{stop-color:var(--aq-amber,#fbb03b)} .aq .gr{stop-color:var(--aq-green,#34d399)}
    .aq-sm .aq .fine{display:none} @media (max-width:32px){.aq .fine{display:none}}
    .aq .weed{transform-box:fill-box;transform-origin:50% 100%;animation:aq-sway 2.4s ease-in-out infinite} .aq .wd{animation-delay:-1.2s}
    .aq .swim{transform-box:fill-box;transform-origin:50% 50%;animation:aq-swim 2.4s ease-in-out infinite}
    .aq .fishm{animation:aq-bob 1.2s ease-in-out infinite alternate}
    .aq .jelly{animation:aq-jelly 2.4s ease-in-out infinite}
    .aq .tent path{transform-box:fill-box;transform-origin:50% 0;animation:aq-tent 1.2s ease-in-out infinite alternate}
    .aq .snail{animation:aq-creep 2.4s ease-in-out infinite}
    .aq .bub{opacity:0;animation:aq-bub 2.4s ease-in infinite} .aq .b2{animation-delay:-.8s} .aq .b3{animation-delay:-1.6s}
    @keyframes aq-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
    @keyframes aq-swim{0%{transform:translateX(-1.2px) scaleX(1)}44%{transform:translateX(1.8px) scaleX(1)}50%{transform:translateX(1.8px) scaleX(-1)}94%{transform:translateX(-1.2px) scaleX(-1)}100%{transform:translateX(-1.2px) scaleX(1)}}
    @keyframes aq-bob{from{transform:translateY(-.6px)}to{transform:translateY(.7px)}}
    @keyframes aq-jelly{0%,100%{transform:translateY(.4px)}50%{transform:translateY(-1.6px)}}
    @keyframes aq-tent{from{transform:skewX(-9deg)}to{transform:skewX(9deg)}}
    @keyframes aq-creep{0%,100%{transform:translateX(0)}50%{transform:translateX(-1.1px)}}
    @keyframes aq-bub{0%{opacity:0;transform:translateY(3px)}15%{opacity:1}80%{opacity:.8}100%{opacity:0;transform:translateY(-6px)}}
    @keyframes aq-pulse{0%,100%{opacity:1}50%{opacity:.62}}
    .aq .cn{animation:aq-node 2.4s ease-in-out infinite} .aq .c1{animation-delay:-1.6s} .aq .c2{animation-delay:-.8s}
    @keyframes aq-node{0%,100%{opacity:.7;transform:scale(.82) rotate(0)}12%{opacity:1;transform:scale(1.4) rotate(22deg)}33%{opacity:.7;transform:scale(.82) rotate(0)}}
    .aq .cn{animation:aq-grow 2.4s ease-in-out infinite} .aq .cn .gl{animation:aq-glow 2.4s ease-in-out infinite}
    .aq .core{animation:aq-core 2.4s ease-out infinite} .aq .bloom{animation:aq-bloom 2.4s ease-out infinite} .aq .ray{animation:aq-ray 2.4s ease-out infinite}
    .aq .s1 :is(.cn,.gl,.core,.bloom,.ray){animation-delay:-1.6s} .aq .s2 :is(.cn,.gl,.core,.bloom,.ray){animation-delay:-.8s}
    @keyframes aq-grow{0%,40%,100%{transform:scale(.6)}18%{transform:scale(1.25)}}
    @keyframes aq-glow{0%,40%,100%{opacity:.2}18%{opacity:1}}
    @keyframes aq-core{0%,8%{opacity:0;transform:scale(.3)}18%{opacity:1;transform:scale(1)}32%,100%{opacity:0;transform:scale(.4)}}
    @keyframes aq-bloom{0%,8%{opacity:0;transform:scale(.5)}18%{opacity:.95;transform:scale(1)}42%,100%{opacity:0;transform:scale(2.1)}}
    @keyframes aq-ray{0%,10%{opacity:0}19%{opacity:.6}34%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.aq *{animation:none!important}.aq .bub{opacity:.85}.aq .cn{opacity:1}.aq{animation:aq-pulse 2.4s ease-in-out infinite}}
    .aq-reduced .aq *{animation:none!important}.aq-reduced .aq .bub{opacity:.85}.aq-reduced .aq .cn{opacity:1}.aq-reduced .aq{animation:aq-pulse 2.4s ease-in-out infinite}
  </style>
