name: Release

# Tag vX.Y.Z (stable) or vX.Y.Z-rc.N / vX.Y.Z-beta.N (beta, GitHub prerelease):
# run the tests, build the release tarball with scripts/build-release.sh,
# sign SHA256SUMS with cosign keyless (GitHub OIDC), publish a GitHub Release.
# Asset + verification contract: docs/packaging/RELEASES.md.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Python tests
    if: github.repository == 'leolau/aquarium'
    uses: ./.github/workflows/tests.yml
    with:
      slice_count: 8

  agent-home:
    name: agent-home typecheck + lint + tests
    if: github.repository == 'leolau/aquarium'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/retry
        with:
          command: npm ci --ignore-scripts
      - run: npm run --prefix agent-home typecheck
      - run: npm run --prefix agent-home lint
      - run: npm run --prefix agent-home test

  build:
    name: Build + sign tarball
    needs: [tests, agent-home]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # cosign keyless: GitHub OIDC token -> Fulcio certificate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Build tarball
        run: scripts/build-release.sh "$GITHUB_REF_NAME" --out dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Sign SHA256SUMS (keyless)
        working-directory: dist
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            --bundle SHA256SUMS.cosign.bundle \
            SHA256SUMS
      - name: Verify like the installer does
        working-directory: dist
        run: |
          cosign verify-blob \
            --certificate SHA256SUMS.pem --signature SHA256SUMS.sig \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
          sha256sum -c SHA256SUMS
          tar -tzf "aquarium-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" | head -1 | grep -qx "aquarium-${GITHUB_REF_NAME}/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Create release and update channels.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CHANNEL=$(python3 scripts/release_channels.py check "$TAG")
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[]' | jq -s . > releases.json
          python3 scripts/release_channels.py channels "$TAG" --releases releases.json \
            --repo "$GITHUB_REPOSITORY" > dist/channels.json
          cat dist/channels.json
          cat > notes.md <<NOTES
          Channel: **${CHANNEL}**

          Verify before installing (needs [cosign](https://docs.sigstore.dev/cosign/system_config/installation/) v2):

          \`\`\`
          cosign verify-blob --certificate SHA256SUMS.pem --signature SHA256SUMS.sig \\
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          sha256sum -c SHA256SUMS
          \`\`\`
          NOTES
          sed -i 's/^          //' notes.md
          STABLE=$(jq -r '.channels.stable.version // empty' dist/channels.json)
          # Only the newest stable becomes "Latest" (a v1.0.1 hotfix after v1.1.0 does not).
          FLAGS=(--latest=false)
          [ "$STABLE" = "$TAG" ] && FLAGS=(--latest)
          [ "$CHANNEL" = beta ] && FLAGS=(--prerelease --latest=false)
          gh release create "$TAG" --verify-tag --title "Aquarium $TAG" \
            --notes-file notes.md --generate-notes "${FLAGS[@]}" \
            dist/aquarium-*-linux-x86_64.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig \
            dist/SHA256SUMS.pem dist/SHA256SUMS.cosign.bundle dist/channels.json
          # Keep releases/latest/download/channels.json current after a beta or hotfix.
          if [ -n "$STABLE" ] && [ "$STABLE" != "$TAG" ]; then
            gh release upload "$STABLE" dist/channels.json --clobber
          fi
